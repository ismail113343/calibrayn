chunking:
  target_words: 500
  overlap_words: 50

retrieval:
  top_k: 4

sm2:
  initial_easiness: 2.5
  min_easiness: 1.3
  first_interval_days: 1
  second_interval_days: 6
  pass_grade: 3
  repeat_below_grade: 4
  relearn_minutes: 10
  max_interval_days: null

zpd:
  window: 10
  target_low: 0.60
  target_high: 0.85
  min_attempts: 5
  min_level: 1
  max_level: 5
  start_level: 3

metacognition:
  window: 15
  overconfidence_threshold: 0.30
  underconfidence_threshold: 0.30
  min_ratings_before_use: 10