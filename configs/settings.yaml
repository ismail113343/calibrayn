chunking:
  target_words: 500
  overlap_words: 50

retrieval:
  top_k: 4

grounding:
  min_support: 0.35

sm2:
  initial_easiness: 2.5
  min_easiness: 1.3
  first_interval_days: 1
  second_interval_days: 6
  pass_grade: 3
  repeat_below_grade: 4
  relearn_minutes: 10
  max_interval_days: null

zpd:
  window: 10
  target_low: 0.60
  target_high: 0.85
  min_attempts: 5
  min_level: 1
  max_level: 5
  start_level: 3

cognitive_load:
  window: 10
  baseline_window: 30
  min_attempts: 5
  min_baseline_attempts: 5
  max_response_seconds: 300.0
  slow_ratio: 2.0
  fatigue_start_minutes: 20.0
  fatigue_full_minutes: 60.0
  accuracy_weight: 0.5
  response_time_weight: 0.3
  session_weight: 0.2
  low_below: 0.35
  high_above: 0.65

metacognition:
  window: 15
  min_ratings_before_use: 10
  overconfidence_threshold: 0.30
  underconfidence_threshold: 0.30
  sure_level: 1.0
  unsure_level: 0.5
  guessing_level: 0.0

ease_adjustment:
  confident_error_penalty: 0.25
  persistent_overconfidence_extra: 0.10
  min_easiness: 1.3

agent:
  correct_from: 0.6
  delayed_recall_minutes: 30
  break_session_signal: 0.5
  guessing_grade_cap: 3
