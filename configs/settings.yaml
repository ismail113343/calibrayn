chunking:
  target_words: 500
  overlap_words: 50

retrieval:
  top_k: 4

sm2:
  initial_easiness: 2.5
  min_easiness: 1.3

zpd:
  window: 10
  target_low: 0.60
  target_high: 0.85

metacognition:
  window: 15
  overconfidence_threshold: 0.30
  underconfidence_threshold: 0.30
  min_ratings_before_use: 10
